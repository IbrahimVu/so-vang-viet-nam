name: Deploy Sổ Vàng to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub uses UTC. These slots cover 08:30–20:30 in Vietnam.
    - cron: '30-55/5 1 * * *'
    - cron: '*/5 2-12 * * *'
    - cron: '0-30/5 13 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.scan.outputs.publish }}
      scan_state: ${{ steps.scan.outputs.scan_state }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - id: scan
        run: node build-pages.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v4
        if: steps.scan.outputs.publish == 'true'
        with:
          path: dist/pages

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: needs.build.outputs.publish == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  remember:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, deploy]
    if: needs.build.outputs.scan_state != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --input-type=module -e "import { saveScanState } from './scan-state.mjs'; await saveScanState();"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCAN_STATE_JSON: ${{ needs.build.outputs.scan_state }}
